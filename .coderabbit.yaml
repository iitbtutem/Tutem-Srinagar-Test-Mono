reviews:
  auto_review:
    enabled: true
    target_branches:
      - main
      - dev
    draft: false   # skip draft PRs

  review_status: true   # shows status message in PR

  path_filters:
    # Docs & markdown
    - "!*.md"
    - "!docs/**"

    # Build outputs
    - "!dist/**"
    - "!build/**"
    - "!.next/**"
    - "!out/**"

    # Dependency / lock files
    - "!package-lock.json"
    - "!yarn.lock"
    - "!pnpm-lock.yaml"

    # Logs
    - "!*.log"

    # Environment files
    - "!.env"
    - "!.env.*"

    # Coverage reports
    - "!coverage/**"

    # Generated code
    - "!**/generated/**"
    - "!**/*.gen.*"

    # Minified files
    - "!*.min.js"
    - "!*.min.css"
